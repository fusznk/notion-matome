
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  background: #ffffff;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
  width: 100%;
}

.gallery a {
  display: block;
  aspect-ratio: 1 / 1;
  overflow: hidden;
}

.gallery img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.2s ease;
}

.gallery a:hover img {
  opacity: 0.8;
}
</style>
</head>

<body>

<div class="gallery">

  <a href="https://example.com/1" target="_blank" rel="noopener noreferrer">
    <img src="images/photo1.jpg" alt="">
  </a>

    <img src="images/photo2.jpg" alt="">
  </a>

</div>

</body>
</html>
